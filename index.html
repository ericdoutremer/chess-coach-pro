<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Chess Coach Pro</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish.min.js"></script>

<script src="openings.js"></script>
<script src="app.js"></script>

</head>

<body>

<header class="topbar">♟️ Chess Coach Pro</header>

<div id="menu">

<div class="card" onclick="startGame('play')">
<h2>▶ Jouer vs IA</h2>
<p>Affronte le moteur</p>
</div>

<div class="card" onclick="startGame('train')">
<h2>🧠 Entraînement</h2>
<p>Répertoire d’ouvertures</p>
</div>

</div>

<div id="gameArea">

<div class="panel">

<select id="opening">
<option value="anglaise">Anglaise</option>
<option value="scandinave">Scandinave</option>
<option value="hollandaise">Hollandaise</option>
</select>

<select id="elo">
<option>800</option>
<option>1200</option>
<option selected>1500</option>
<option>1800</option>
</select>

<button onclick="newGame()">♻ Nouvelle partie</button>

</div>

<div id="board"></div>

<div class="panel">
<div id="eloDisplay">Elo joueur: 1000</div>
</div>

<div id="info"></div>

</div>

</body>
</html>
