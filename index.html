<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>Chess Coach Pro</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

</head>

<body>

<header>♟️ Chess Coach Pro</header>

<div class="panel">
<label>IA (Elo)</label>
<select id="elo">
<option>800</option>
<option>1000</option>
<option>1200</option>
<option selected>1500</option>
<option>1800</option>
</select>
</div>

<div id="board"></div>

<div class="panel buttons">
<button onclick="newGame()">Nouvelle partie</button>
<button onclick="hint()">💡 Meilleur coup</button>
</div>

<div id="info"></div>

<script src="app.js"></script>

</body>
</html>
